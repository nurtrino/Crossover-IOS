name: CrossoverPad
options:
  bundleIdPrefix: com.crossoverpad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Swift *language mode* (valid Xcode values: 4.0, 4.2, 5.0, 6.0) — not the
    # toolchain version. The sources use Swift 5.9/5.10 features (switch
    # expressions, #Preview), which any Xcode 15+ toolchain provides in 5.0 mode.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CrossoverPad:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossoverpad.app
  CrossoverPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CrossoverPad

schemes:
  CrossoverPad:
    build:
      targets:
        CrossoverPad: all
    test:
      targets: [CrossoverPadTests]
