name: CrossoverPad
options:
  bundleIdPrefix: com.crossoverpad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Swift *language mode* (valid Xcode values: 4.0, 4.2, 5.0, 6.0) — not the
    # toolchain version. The sources use Swift 5.9/5.10 features (switch
    # expressions, #Preview), which any Xcode 15+ toolchain provides in 5.0 mode.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CrossoverPad:
    type: application
    platform: iOS
    sources:
      - Sources
      # WineRuntime is populated at build time by the runtime-bearing IPA
      # pipeline (.github/workflows/build-ipa-runtime.yml): the cross-built
      # iOS Wine libraries, the OS-independent PE DLLs, and the prepared
      # prefix. It is a folder reference (kept as-is in the bundle) and is
      # optional — a plain `build-ipa.yml` shell build simply ships it empty.
      - path: WineRuntime
        type: folder
        optional: true
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crossoverpad.app
        # Entitlements the sideload channel applies (JIT, debugger attach,
        # increased memory, extended VA). Inert under CODE_SIGNING_ALLOWED=NO
        # in CI; applied when a JIT-capable channel signs the IPA.
        CODE_SIGN_ENTITLEMENTS: CrossoverPad.entitlements
  CrossoverPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CrossoverPad

schemes:
  CrossoverPad:
    build:
      targets:
        CrossoverPad: all
    test:
      targets: [CrossoverPadTests]
