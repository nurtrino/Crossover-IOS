name: Build runtime-bearing IPA

# Produces an unsigned IPA that actually EMBEDS the Wine runtime:
#   WineRuntime/lib/     — cross-built iOS-native Wine libs (arm64 Mach-O)
#   WineRuntime/pe/      — OS-independent Windows PE DLLs
#   WineRuntime/prefix/  — the prepared Wine prefix
#
# This is the artifact for on-device testing. HONEST SCOPE: it contains the
# real runtime, but launching a GUI guest still needs the iOS display driver
# and on-device JIT (docs/HANDOFF-M2.md). The app reports the runtime tier
# truthfully (WineRuntimeBundle) and NativeWineEngine fails with a specific
# reason rather than pretending to run. The build is fully verifiable; the
# on-device execution is what the testing phase measures.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = auto rt-ipa-rN)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---- Linux: build Wine, harvest PE DLLs + prepared prefix ---------------
  linux-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            flex bison gcc-mingw-w64-x86-64 xvfb \
            libx11-dev libfreetype-dev libxext-dev libxrender-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev
      - name: Apply fork patch series
        run: cd native/patches && ./apply.sh
      - name: Build Wine (Linux, PE DLLs)
        run: |
          mkdir -p native/wine-build && cd native/wine-build
          ../wine/configure --enable-win64 --disable-tests > cfg.log 2>&1 || { tail -30 cfg.log; exit 1; }
          make -j"$(nproc)" > build.log 2>&1 || { tail -60 build.log; exit 1; }
          echo "PE DLLs: $(find dlls -name '*.dll' | wc -l)"
      - name: Build prepared prefix
        run: |
          chmod +x native/ios/make-prefix-bundle.sh
          xvfb-run -a native/ios/make-prefix-bundle.sh || true
          # trust the artifact, not just the exit code (cleanup can leak rc)
          test -f native/ios/build/prefix-bundle.tar.gz \
            || { echo "::error::prefix bundle not produced"; exit 1; }
          ls -la native/ios/build/
      - name: Stage runtime bits
        run: |
          mkdir -p stage/pe
          # OS-independent PE DLLs (x86_64-windows) — the guest binaries
          find native/wine-build/dlls -path '*/x86_64-windows/*.dll' -exec cp {} stage/pe/ \;
          echo "staged $(ls stage/pe | wc -l) PE DLLs"
          # ship the prepared prefix AS THE TARBALL: tar preserves the internal
          # symlinks (c: -> ../drive_c) without upload-artifact following them
          cp native/ios/build/prefix-bundle.tar.gz stage/
          cp native/ios/build/prefix-bundle.manifest stage/ || true
          du -sh stage/pe stage/prefix-bundle.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-bits
          path: stage/
          retention-days: 1
          if-no-files-found: error

  # ---- macOS: cross-build iOS libs, assemble + build the IPA -------------
  ios-ipa:
    runs-on: macos-15
    needs: linux-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          brew install bison llvm lld autoconf xcodegen
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Apply fork patch series + regenerate configure
        run: |
          cd native/patches && ./apply.sh
          cd ../wine && autoconf

      - name: Build native Wine tools
        run: |
          mkdir native-tools && cd native-tools
          ../native/wine/configure --enable-win64 --without-x --without-freetype \
            --disable-tests >cfg.log 2>&1 || { tail -30 cfg.log; exit 1; }
          make -j3 __tooldeps__ >tools.log 2>&1 || { tail -40 tools.log; exit 1; }

      - name: Cross-build the FULL iOS Wine runtime (arm64)
        run: |
          # wrc reads its NLS data from <toolsdir>/nls; populate the build dir
          # with the checked-in source .nls (locale.nls + codepage tables).
          cp native/wine/nls/*.nls native-tools/nls/ 2>/dev/null || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir ios-build && cd ios-build
          ../native/wine/configure \
            --host=aarch64-apple-darwin --with-wine-tools=../native-tools \
            --without-x --without-freetype --disable-tests \
            CC="$(xcrun -f clang) -arch arm64 -isysroot $SDK -miphoneos-version-min=16.0 -DWINE_FORKLESS" \
            CXX="$(xcrun -f clang++) -arch arm64 -isysroot $SDK -miphoneos-version-min=16.0" \
            >cfg.log 2>&1 || { tail -30 cfg.log; exit 1; }
          # full build: loader + every unixlib + the arm64-Windows PE guest set
          set +e
          make -j3 >build.log 2>&1
          rc=$?; set -e
          tail -40 build.log
          if [ $rc -ne 0 ]; then
            echo "::warning::full make returned $rc; checking whether the core runtime still built"
            grep -B1 -A4 "Error [0-9]\|error:" build.log | tail -50
          fi
          # hard gate: the pieces the app bootstrap needs must exist as arm64
          # (wineios = the display driver, both halves; explorer owns the desktop)
          for f in loader/wine dlls/ntdll/ntdll.so dlls/win32u/win32u.so server/wineserver \
                   dlls/wineios.drv/wineios.so dlls/wineios.drv/aarch64-windows/wineios.drv \
                   programs/cmd/aarch64-windows/cmd.exe programs/wineboot/aarch64-windows/wineboot.exe \
                   programs/explorer/aarch64-windows/explorer.exe programs/notepad/aarch64-windows/notepad.exe; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          for f in loader/wine dlls/ntdll/ntdll.so server/wineserver; do
            file "$f" | grep -q arm64 || { echo "::error::$f not arm64"; exit 1; }
          done
          echo "unix .so count: $(find dlls -name '*.so' | wc -l)"
          echo "arm64 PE dll count: $(find dlls -path '*/aarch64-windows/*.dll' | wc -l)"

      - name: Download Linux runtime bits
        uses: actions/download-artifact@v4
        with:
          name: linux-runtime-bits
          path: linux-bits

      - name: Assemble WineRuntime into the app source tree
        run: |
          # Ship the runtime as a BUILD-TREE subset under WineRuntime/rt so that,
          # when the app dlopen's rt/dlls/ntdll/ntdll.so in-process, Wine's
          # dladdr-based path detection runs in "build_dir" mode and finds the
          # loader, the arm64 PE DLLs/EXEs, the unix .so libs and the NLS data
          # exactly as the (proven) simulator run does — no fragile installed-mode
          # path math.
          RT=CrossoverPad/WineRuntime
          rm -rf "$RT"; mkdir -p "$RT/rt/loader" "$RT/rt/server" "$RT/prefix"
          # unix .so libs (dlls/<name>/<name>.so, incl. dlls/ntdll/ntdll.so) and
          # the arm64-Windows PE modules — .dll plus .drv (wineios.drv, the
          # display driver, is a .drv; a .dll-only glob would silently drop it),
          # copied preserving their build-tree paths.
          ( cd ios-build && find dlls \( -name '*.so' -o -path '*/aarch64-windows/*.dll' \
              -o -path '*/aarch64-windows/*.drv' \) -print0 \
              | tar -cf - --null -T - ) | ( cd "$RT/rt" && tar -xf - )
          # the console programs (cmd.exe, wineboot.exe, …) as arm64 PE.
          ( cd ios-build && find programs -path '*/aarch64-windows/*.exe' -print0 \
              | tar -cf - --null -T - ) | ( cd "$RT/rt" && tar -xf - )
          cp ios-build/loader/wine     "$RT/rt/loader/"
          cp ios-build/server/wineserver "$RT/rt/server/"
          cp -R native/wine/nls        "$RT/rt/nls"
          # prefix skeleton (registry + drive layout); tar recreates the symlinks.
          tar -C "$RT/prefix" --strip-components=1 -xzf linux-bits/prefix-bundle.tar.gz
          {
            echo "# WineRuntime (build_dir layout) assembled $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ntdll.so:   $([ -f "$RT/rt/dlls/ntdll/ntdll.so" ] && echo present || echo MISSING)"
            echo "unix .so:   $(find "$RT/rt/dlls" -name '*.so' | wc -l)"
            echo "PE dll:     $(find "$RT/rt/dlls" -path '*/aarch64-windows/*.dll' | wc -l)"
            echo "PE exe:     $(find "$RT/rt/programs" -path '*/aarch64-windows/*.exe' | wc -l)"
            echo "cmd.exe:    $([ -f "$RT/rt/programs/cmd/aarch64-windows/cmd.exe" ] && echo yes || echo no)"
            echo "display:    $([ -f "$RT/rt/dlls/wineios.drv/wineios.so" ] && [ -f "$RT/rt/dlls/wineios.drv/aarch64-windows/wineios.drv" ] && echo wineios.drv || echo MISSING)"
            echo "nls:        $(ls "$RT/rt/nls"/*.nls 2>/dev/null | wc -l)"
            echo "prefix:     $([ -f "$RT/prefix/drive_c/windows/system32/kernel32.dll" ] && echo present || echo MISSING)"
          } | tee "$RT/MANIFEST.txt"
          # hard sanity gates
          test -f "$RT/rt/dlls/ntdll/ntdll.so" || { echo "::error::ntdll.so missing"; exit 1; }
          test -f "$RT/rt/programs/cmd/aarch64-windows/cmd.exe" || { echo "::error::cmd.exe missing"; exit 1; }
          test -f "$RT/rt/dlls/wineios.drv/wineios.so" || { echo "::error::wineios.so (display driver unixlib) missing"; exit 1; }
          test -f "$RT/rt/dlls/wineios.drv/aarch64-windows/wineios.drv" || { echo "::error::wineios.drv (display driver PE) missing"; exit 1; }
          test "$(find "$RT/rt/dlls" -path '*/aarch64-windows/*.dll' | wc -l)" -gt 100 || { echo "::error::PE set too small"; exit 1; }
          test -f "$RT/rt/nls/locale.nls" || { echo "::error::nls missing"; exit 1; }
          test -f "$RT/prefix/drive_c/windows/system32/kernel32.dll" || { echo "::error::prefix missing"; exit 1; }
          du -sh "$RT" "$RT"/rt "$RT"/prefix

      - name: Generate Xcode project
        working-directory: CrossoverPad
        run: xcodegen generate

      - name: Build (Release, unsigned, device slice)
        working-directory: CrossoverPad
        run: |
          set -o pipefail
          xcodebuild -project CrossoverPad.xcodeproj -scheme CrossoverPad \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" build | tail -25

      - name: Verify the app embeds the runtime
        working-directory: CrossoverPad
        run: |
          APP=build/CrossoverPad.app
          test -f "$APP/WineRuntime/rt/dlls/ntdll/ntdll.so" || { echo "::error::WineRuntime not embedded"; exit 1; }
          test -f "$APP/WineRuntime/rt/programs/cmd/aarch64-windows/cmd.exe" || { echo "::error::cmd.exe missing"; exit 1; }
          test -f "$APP/WineRuntime/prefix/drive_c/windows/system32/kernel32.dll" || exit 1
          echo "embedded PE DLLs: $(find "$APP/WineRuntime/rt/dlls" -path '*/aarch64-windows/*.dll' | wc -l)"
          file "$APP/WineRuntime/rt/dlls/ntdll/ntdll.so"
          file "$APP/CrossoverPad" | grep -q arm64

      - name: Package IPA
        working-directory: CrossoverPad
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/CrossoverPad.app Payload/
          zip -qry CrossoverPad-runtime-unsigned.ipa Payload
          echo "IPA size: $(du -h CrossoverPad-runtime-unsigned.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: CrossoverPad-runtime-unsigned.ipa
          path: CrossoverPad/CrossoverPad-runtime-unsigned.ipa
          if-no-files-found: error

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT";
          else echo "tag=rt-ipa-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi

      - name: Release with direct download link
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/CrossoverPad-runtime-unsigned.ipa"
          cat > notes.md <<EOF
          # CrossoverPad ${TAG} — in-app CMD console (unsigned IPA)

          **Direct download:** ${URL}

          ## New: run cmd.exe from inside the app

          Open a bottle → **Open CMD Console** → you get a live terminal driving
          \`cmd.exe\` **in-process**: the app dlopen's the embedded \`ntdll.so\` and
          runs Wine on a background thread (iOS forbids spawning a separate
          loader), with the guest's stdin/stdout wired to the on-screen console.
          Type \`ver\`, \`dir\`, \`echo hi\` and see Windows respond. A guest exit no
          longer kills the app (forkless process-exit routes to pthread_exit).
          On device this needs JIT — attach **StikDebug**.

          ## A Windows program runs in the iOS runtime

          The headline for 0.2: this exact Wine runtime, built for the iOS
          Simulator and driven end-to-end in CI on an Apple-silicon macOS
          runner (same CPU, same ABI, same 16 KB pages, same reserved-x18
          behavior as a device), **executed a real Windows console program**.
          \`cmd.exe /c echo WINDOWS_RAN_IN_IOS_SIM_%PROCESSOR_ARCHITECTURE%\`
          printed **\`WINDOWS_RAN_IN_IOS_SIM_ARM64\`** and exited 0 — Windows
          PE code running under Wine inside the iOS Simulator. The
          \`wine-ios-sim-run\` workflow reproduces this on every push.

          Getting there meant solving four Apple-arm64 architectural blockers,
          each proven by the sim run:
          1. **x18 / TEB.** iOS zeroes x18 (which Wine uses to hold the TEB) on
             every kernel→user transition. Re-established on every signal-resume
             path plus a self-healing catch-all in the SIGSEGV handler.
          2. **KUSER / address space.** The arm64 kernel walls off the low 4 GB,
             so the shared-user-data page is relocated above 4 GB and the loader
             uses the default Mach-O layout.
          3. **PE dll mapping.** With a mandatory 4 GB \`__PAGEZERO\` and no Wine
             preloader, dyld's own mappings land in the range Wine scans for free
             space; \`try_map_free_area\` now steps past them (Apple reports them
             as ENOMEM, not EEXIST) instead of aborting the load.
          4. **Syscall ABI.** The Apple arm64 ABI packs sub-8-byte stack
             arguments to natural size, while the Windows guest and Wine's
             dispatcher use 8-byte slots — so \`NtMapViewOfSection\`'s
             \`protect\` arg (arg 10) was read from the wrong offset, failing
             every dll load. Fixed at the syscall boundary.

          ## What the IPA contains

          This build EMBEDS the **complete** iOS-native Wine runtime:
          - \`WineRuntime/lib/\` — the loader (\`wine\`), \`wineserver\`, and
            every Wine unixlib \`.so\` (\`ntdll.so\`, \`win32u.so\`, …), cross-built
            as **arm64 Mach-O** against the iPhoneOS SDK with the forkless
            in-process model;
          - \`WineRuntime/pe/\` — the **native arm64-Windows** guest set: the
            Windows PE DLLs plus the console programs (\`cmd.exe\`,
            \`wineboot.exe\`). arm64 guests run natively on an arm64 device — no
            x86 emulation;
          - \`WineRuntime/prefix/\` — the prepared Wine prefix (registry +
            drive-layout skeleton).

          ## Simulator vs. device — honest scope

          The Simulator run above is faithful to the CPU, ABI, page size and
          x18 behavior, but NOT to code-signing/JIT (it runs under the macOS
          kernel). On a real device the identical runtime needs **JIT/W^X** for
          the PE loader — available on a debugger-assisted channel such as
          **StikDebug** — and the raised memory / extended-VA limits declared in
          \`CrossoverPad.entitlements\` (increased-memory-limit,
          extended-virtual-addressing). \`EngineCapabilities.jitAvailable()\`
          probes JIT live (CS_DEBUGGED + an RWX-map attempt) rather than trusting
          a build flag, and the app reports the runtime tier truthfully instead
          of pretending to run. A GUI guest additionally needs the UIKit/Metal
          display driver; a console guest needs neither.

          This is an **alpha for on-device testing.** Install unsigned via your
          sideload channel, attach StikDebug for JIT, and exercise the console
          path first.

          Built by run ${{ github.run_id }} from ${{ github.sha }}.
          EOF
          gh release create "$TAG" CrossoverPad/CrossoverPad-runtime-unsigned.ipa \
            --title "CrossoverPad 0.2 Release Alpha (${TAG})" \
            --notes-file notes.md --prerelease --target "${{ github.sha }}"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
