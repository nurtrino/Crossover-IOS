name: Run Windows program in iOS Simulator

# The one environment reachable from CI where Wine can actually EXECUTE a
# Windows program in an iOS runtime: the iOS Simulator. It runs on the macOS
# runner (so fork + JIT are permitted, unlike a locked-down device) and
# `xcrun simctl spawn` runs a simulator-targeted binary inside it. The fork
# patches guard on TARGET_OS_OSX, so the simulator (TARGET_OS_IPHONE=1,
# TARGET_OS_OSX=0) builds the iOS code paths.
#
# This is a NORMAL Wine build (no WINE_FORKLESS) — the simulator allows Wine
# to fork its own server, which is the simplest path to demonstrating
# execution. Success = a console Windows program's output appears from inside
# the simulator. Failure still pins the exact blocker (address-space
# reservation, loader, server) with hard logs — the diagnostic the on-device
# work needs. GUI is out of scope (no display driver); cmd.exe is console.

on:
  workflow_dispatch:

jobs:
  sim-run:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          brew install bison llvm lld autoconf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Apply patches + regenerate configure
        run: |
          cd native/patches && ./apply.sh
          cd ../wine && autoconf

      - name: Build native Wine tools
        run: |
          mkdir native-tools && cd native-tools
          ../native/wine/configure --enable-win64 --without-x --without-freetype \
            --disable-tests >cfg.log 2>&1 || { tail -30 cfg.log; exit 1; }
          make -j3 __tooldeps__ >tools.log 2>&1 || { tail -40 tools.log; exit 1; }
          # wrc/wmc compute their NLS dir as <bindir>/../../nls = native-tools/nls.
          # configure created that as a real (VPATH) build subdir, and the build
          # never populates it — locale.nls and the c_*.nls codepage tables are
          # checked-in SOURCE files. Copy them into the build dir so resource
          # compilation in the cross build can load them.
          cp ../native/wine/nls/*.nls nls/
          ls -l nls/locale.nls

      - name: Configure Wine for the iOS Simulator (arm64)
        run: |
          SIMSDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "SIMSDK=$SIMSDK"
          mkdir sim-build && cd sim-build
          ../native/wine/configure \
            --host=aarch64-apple-darwin --with-wine-tools=../native-tools \
            --without-x --without-freetype --disable-tests \
            CC="$(xcrun -f clang) -arch arm64 -isysroot $SIMSDK -mios-simulator-version-min=16.0" \
            CXX="$(xcrun -f clang++) -arch arm64 -isysroot $SIMSDK -mios-simulator-version-min=16.0" \
            >cfg.log 2>&1 || { tail -40 cfg.log; exit 1; }
          echo "configured"

      - name: Build Wine (loader + dlls + cmd.exe)
        run: |
          cd sim-build
          # wrc resolves its NLS dir from its own bindir (native-tools/nls,
          # populated in the tools step), so no per-tree nls setup is needed here.
          set +e
          make -j3 >build.log 2>&1
          rc=$?
          set -e
          tail -30 build.log
          # a partial build must be loud: a silently failed make left the
          # PE programs unbuilt for several runs (winscard/PCSC)
          if [ $rc -ne 0 ]; then
            echo "::error::make failed (rc=$rc)"
            grep -B2 -A6 "Error \|error:" build.log | tail -60
            exit 1
          fi
          # the pieces the run needs
          for f in loader/wine dlls/ntdll/ntdll.so server/wineserver programs/cmd/x86_64-windows/cmd.exe; do
            if [ -f "$f" ]; then echo "OK  $f ($(file -b "$f" | cut -c1-40))"; else echo "MISSING $f"; fi
          done
          test -f loader/wine && test -f dlls/ntdll/ntdll.so || { echo "::error::core build incomplete"; tail -80 build.log; exit 1; }
          file loader/wine | grep -q arm64 || exit 1
          echo "=== PE layout (which arch dirs did the build produce?) ==="
          ls programs/wineboot/ programs/cmd/ dlls/ntdll/ 2>/dev/null | head -20
          ls programs/cmd/*-windows/cmd.exe programs/wineboot/*-windows/wineboot.exe 2>/dev/null || echo "no PE exes found"

      - name: Boot an iOS Simulator
        id: sim
        run: |
          # first available simulator UDID (the runner ships iOS runtimes)
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/\([0-9A-F-]{36}\)/{print $2; exit}')
          echo "picked udid: $UDID"
          test -n "$UDID" || { echo "::error::no available simulator"; xcrun simctl list devices; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          echo "booted"

      - name: Run cmd.exe inside the simulator
        id: run
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          BUILD="$PWD/sim-build"
          WP="$PWD/simprefix"
          mkdir -p "$WP"
          # -- diagnostics: the previous run died with SIGKILL at exec, which on
          # Apple platforms means AMFI (signature) or bad load commands. Pin it.
          echo "=== loader/wine header + PAGEZERO + platform ==="
          otool -hv "$BUILD/loader/wine" | head -5 || true
          otool -l "$BUILD/loader/wine" | grep -B1 -A5 "__PAGEZERO" | head -12 || true
          otool -l "$BUILD/loader/wine" | grep -A4 "LC_BUILD_VERSION\|LC_VERSION_MIN" | head -12 || true
          codesign -dv "$BUILD/loader/wine" 2>&1 | head -6 || true
          # (An earlier probe established that the kernel refuses ANY page zero
          # below 4GB for arm64 — launchd error 153 — which is why the KUSER
          # shared data page is relocated above 4GB on iOS builds.)
          echo "=== probe: MAP_FIXED at the relocated KUSER address 0x17ffe0000 ==="
          SIMSDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          cat > probe.c <<'EOF'
          #include <stdio.h>
          #include <sys/mman.h>
          int main(void)
          {
              void *want = (void *)0x17ffe0000UL;
              void *got = mmap( want, 0x4000, PROT_READ | PROT_WRITE,
                                MAP_PRIVATE | MAP_ANON | MAP_FIXED, -1, 0 );
              printf( "PROBE_SPAWNED highmap %p -> %p (%s)\n", want, got,
                      got == want ? "OK" : "FAIL" );
              return 0;
          }
          EOF
          xcrun clang -arch arm64 -isysroot "$SIMSDK" -mios-simulator-version-min=16.0 -o probe probe.c
          xcrun simctl spawn "$UDID" "$PWD/probe" || echo "probe spawn FAILED rc=$?"
          # NB: do NOT codesign -f -s - these binaries. That strips the
          # linker-signed flag from the ad-hoc signature, and AMFI then rejects
          # them (-423, verified). The as-built linker signature is the one
          # the simulator accepts — same class as the hello binary above.
          echo "=== creating the prefix (wineboot, +seh to expose the exception chain) ==="
          xcrun simctl spawn "$UDID" /usr/bin/env WINEPREFIX="$WP" WINEDEBUG=+err,+seh \
            "$BUILD/loader/wine" wineboot.exe --init >boot.log 2>&1 || true
          tail -80 boot.log || true
          echo "=== symbolize the recurring PE-ntdll fault ==="
          # every run faults at the same spot; map it back to a source line.
          # ntdll.dll links at 0x180000000; the runtime base is in the +module
          # trace of earlier runs (constant), and the fault addr is in the
          # stack-overflow line of this one.
          FAULT=$(grep -o 'stack overflow [0-9]* bytes addr 0x[0-9a-f]*' boot.log | head -1 | awk '{print $NF}')
          NTDLL_PE="$BUILD/dlls/ntdll/aarch64-windows/ntdll.dll"
          if [ -n "$FAULT" ] && [ -f "$NTDLL_PE" ]; then
            RVA=$(( FAULT - 0x6fffffcb0000 ))
            VA=$(( 0x180000000 + RVA ))
            printf 'fault %s -> rva 0x%x -> link-time va 0x%x\n' "$FAULT" "$RVA" "$VA"
            llvm-symbolizer --obj="$NTDLL_PE" "$(printf '0x%x' "$VA")" 2>/dev/null || true
            llvm-objdump -d --start-address=$(( VA - 0x60 )) --stop-address=$(( VA + 0x40 )) "$NTDLL_PE" 2>/dev/null | tail -45 || true
          else
            echo "no stack-overflow line or ntdll.dll missing; skipping symbolization"
          fi
          echo "=== running: cmd.exe /c echo (by name) ==="
          xcrun simctl spawn "$UDID" /usr/bin/env WINEPREFIX="$WP" WINEDEBUG=+err \
            "$BUILD/loader/wine" cmd.exe /c "echo WINDOWS_RAN_IN_IOS_SIM_%PROCESSOR_ARCHITECTURE%" \
            >run.log 2>&1 || true
          echo "--- run.log (by name) ---"; cat run.log || true
          echo "=== running: cmd.exe /c echo (explicit unix path, bypasses system32 search) ==="
          CMDEXE=$(ls "$BUILD"/programs/cmd/*-windows/cmd.exe 2>/dev/null | head -1)
          echo "cmd.exe at: ${CMDEXE:-NOT FOUND}"
          if [ -n "$CMDEXE" ]; then
            xcrun simctl spawn "$UDID" /usr/bin/env WINEPREFIX="$WP" WINEDEBUG=+err \
              "$BUILD/loader/wine" "$CMDEXE" /c "echo WINDOWS_RAN_IN_IOS_SIM_%PROCESSOR_ARCHITECTURE%" \
              >>run.log 2>&1 || true
          fi
          echo "--- run.log (both attempts) ---"; cat run.log || true
          echo "=== kernel/AMFI messages from the unified log (why SIGKILL) ==="
          log show --last 4m --style compact \
            --predicate 'eventMessage CONTAINS[c] "wine" OR process == "amfid" OR eventMessage CONTAINS[c] "CODE SIGNING" OR eventMessage CONTAINS[c] "pagezero"' \
            2>/dev/null | tail -50 || true
          if grep -q "WINDOWS_RAN_IN_IOS_SIM" run.log; then
            echo "::notice::A Windows console program EXECUTED inside the iOS Simulator"
            echo "ran=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cmd.exe did not produce output — see logs for the blocker"
            echo "ran=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-run-logs
          path: |
            sim-build/build.log
            sim-build/cfg.log
            boot.log
            run.log
          if-no-files-found: ignore

      - name: Verdict
        run: |
          echo "ran=${{ steps.run.outputs.ran }}"
          if [ "${{ steps.run.outputs.ran }}" = "yes" ]; then
            echo "Windows software executed in the iOS Simulator runtime."
          else
            echo "Did not execute — logs pin the blocker (address reservation / loader / server)."
            exit 1
          fi
